default_install_hook_types: [pre-commit, pre-push]
exclude: ^src/test/resources/

repos:
  - repo: local
    hooks:
      - id: nextflow-lint
        name: Lint Nextflow scripts and fix formatting
        entry: nextflow lint
        language: system
        files: '\.nf$|nextflow\.config$'
        args:
          [
            "-format",
            "-spaces",
            "4",
            "-harshil-alignment",
            "-output",
            "concise",
          ]
        pass_filenames: true
        require_serial: true
      - id: gradle-test
        name: Run unit tests before push
        entry: mise run test
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
