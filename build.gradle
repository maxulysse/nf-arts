plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '1.2.0-dev'

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'maxulysse'
    className = 'nfarts.ArtsPlugin'
    extensionPoints = [
        'nfarts.ArtsConfig',
        'nfarts.ArtsFactory'
    ]

    registry {
        // From the environment, which `mise run release` fills from .env: this block outranks every other
        // source the release task consults, and a command-line property would show in the process list.
        apiKey = System.getenv('NPR_API_KEY')
        url = System.getenv('NPR_API_URL')
    }
}

// nf-arts.properties carries the version for the "generated by" caption
processResources {
    inputs.property 'version', version
    filesMatching('nf-arts.properties') { expand(version: version) }
}
