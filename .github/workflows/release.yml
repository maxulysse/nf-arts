name: Publish plugin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed on main, without a v prefix"
        required: true
        type: string

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ inputs.version }}
    if: github.repository == 'maxulysse/nf-arts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      NXF_ANSI_LOG: "false"
      # setup-nextflow also sets up Java, so CI has one build
      MISE_DISABLE_TOOLS: java

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release is ready
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a stable version such as 1.1.0'; exit 1; }
          grep -Fxq "version = '$VERSION'" build.gradle || { echo '::error::Version does not match build.gradle'; exit 1; }
          heading=$(grep -F "## v$VERSION - " CHANGELOG.md) || { echo '::error::Add a CHANGELOG.md heading with the codename'; exit 1; }
          echo "TITLE=nf-arts $VERSION - ${heading#* - }" >> "$GITHUB_ENV"
          awk -v heading="## v$VERSION - " '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$VERSION" >/dev/null 2>&1; then echo '::error::GitHub release already exists'; exit 1; fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.nextflow.io/api/v1/plugins/nf-arts/$VERSION")
          [[ "$status" == 404 ]] || { echo "::error::Expected an unpublished version, received HTTP $status"; exit 1; }

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          # this action sets up Java too, 17 by default
          java-version: 21

      - name: Setup tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test
        run: |
          mise run test
          mise run validate

      - name: Publish to the Nextflow Registry
        env:
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
        run: mise run release

      - name: Check the published checksum
        run: |
          curl --fail --silent --show-error "https://registry.nextflow.io/api/v1/plugins/nf-arts/$VERSION" > "$RUNNER_TEMP/registry.json"
          jq -e '.pluginRelease.status == "PUBLISHED"' "$RUNNER_TEMP/registry.json"
          echo "$(jq -er '.pluginRelease.sha512sum' "$RUNNER_TEMP/registry.json")  build/distributions/nf-arts-$VERSION.zip" | sha512sum --check

      - name: Run the published plugin
        env:
          NXF_PLUGINS_DIR: ${{ runner.temp }}/registry-plugins
          NXF_PLUGINS_MODE: prod
          # the registry, not the local plugin repo from mise.toml
          NXF_PLUGINS_TEST_REPOSITORY: ""
        run: |
          mkdir "$NXF_PLUGINS_DIR"
          nextflow plugin install "nf-arts@$VERSION"
          nextflow run validation/ -plugins "nf-arts@$VERSION"

      - name: Create the GitHub release and tag
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --latest

      - name: Update the website
        # a release from GITHUB_TOKEN does not trigger the website's release event
        run: gh workflow run website.yml --ref main
