name: prek
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          # this action sets up Java too, 17 by default
          java-version: 21

      - name: Run the hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
