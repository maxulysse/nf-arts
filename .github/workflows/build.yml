name: nf-arts CI
on:
  # branches run through their pull request, so push only covers main
  push:
    branches:
      - main
    tags-ignore:
      - '*'
  pull_request:
jobs:
  changes:
    name: Detect plugin changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: List changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          else
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || files=unknown
          fi
          echo "$files"
          # The website, docs and Markdown files do not affect the plugin. Anything else, or an unknown list, runs the build.
          if echo "$files" | grep -qvE '^(website/|docs/|\.github/workflows/website[^/]*\.yml$|[^/]+\.md$)'; then
            echo "plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build nf-arts
    needs: changes
    if: needs.changes.outputs.plugin == 'true' && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nextflow_version: ['25.10.0', 'latest-everything']
    env:
      # Nextflow comes from setup-nextflow, so the matrix decides the version, not mise.toml
      MISE_DISABLE_TOOLS: github:nextflow-io/nextflow

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests
        run: mise run test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: mise run install

      - name: Live run
        run: |
          nextflow run validation/
          file results/art.png | grep -q 'PNG image data, 1200 x 1200'

      - name: Render
        run: |
          # the finished validation run, from the history and cache
          nextflow plugin nf-arts:render --file results/rendered.svg
          grep -q "$(tail -1 .nextflow/history | cut -f3)</text>" results/rendered.svg
          ! grep -q 'validation/' results/rendered.svg
          # with no --file, both formats
          nextflow plugin nf-arts:render
          ls art-*.svg art-*.png
          # a trace file with its execution report
          nextflow plugin nf-arts:render --trace src/test/resources/execution_trace.txt --file results/trace.svg
          grep -q 'nf-core/rnavar · 1.2.2 · exotic_kimura' results/trace.svg
          # an nf-core megatest on S3, one arc per task
          nextflow plugin nf-arts:render --trace s3://nf-core-awsmegatests/rnavar/results-ea2c7b6286f5ae18f5b51dc0af6b5330ecd6a13a/pipeline_info/execution_trace_2025-12-05_11-13-40.txt --file results/megatest.svg
          test "$(grep -c '<path ' results/megatest.svg)" -eq 553
          # a failed render exits non-zero
          if nextflow plugin nf-arts:render no_such_run; then exit 1; fi

  # The only required check, so matrix changes need no change to branch protection. Skipped jobs pass.
  ci-pass:
    name: CI pass
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
